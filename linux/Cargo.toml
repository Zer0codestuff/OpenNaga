[package]
name = "opennaga"
version = "2.8.0"
edition = "2021"
rust-version = "1.80"
description = "Remap the buttons of the Razer Naga V2 HyperSpeed and control DPI, polling rate and mouse memory on Linux"
license = "MIT"
repository = "https://github.com/Zer0codestuff/OpenNaga"
publish = false

[[bin]]
name = "opennaga"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
async-channel = "2"
pangocairo = "0.22"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev.package."*"]
opt-level = 1
